azure:
  cosmos:
    endpoint: https://acct.documents.azure.com
    database: quelch
  ai:
    provider: azure_openai
    endpoint: https://test.openai.azure.com
    embedding:
      deployment: text-embedding-3-large
      dimensions: 3072
    chat:
      deployment: gpt-5-mini
      model_name: gpt-5-mini

source_connections:
  - name: jira-cloud
    type: jira
    base_url: https://example.atlassian.net
    auth: { kind: basic, email: user@example.com, token: test-token }
    projects: [DO]

instances:
  - name: ingest
    kind: ingest
    connections: [jira-cloud]
    cycle_interval: 5m
  - name: mcp
    kind: mcp
    expose: [jira_issues]
    api_key: dev
    knowledge_base: kb
    listen: 0.0.0.0:8080
